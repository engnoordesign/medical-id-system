<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Medical National System</title>
<meta name="description" content="Prototype of a unified medical ID system connecting patients, doctors, pharmacies, labs and radiology through one QR-coded profile.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;600&display=swap">
<style>
/* Layout: sticky app bar + role tabs, single content column (max 1180px) with card sections; RTL-first, mirrors to LTR. */
:root{
  --bg:#f2f5f4; --surface:#ffffff; --surface-2:#e9efed; --line:#d3dedb; --ink:#12211e; --muted:#566864;
  --accent:#0c6a5e; --accent-ink:#ffffff; --accent-soft:#d5ebe6;
  --ok:#1d7a3e; --ok-soft:#daf0e1; --warn:#9a5800; --warn-soft:#fbebcf; --bad:#b42318; --bad-soft:#fbe0dc;
  --info:#1c5ea6; --info-soft:#dce8f7; --violet:#6640c2; --violet-soft:#ebe4fa;
  --shadow:0 1px 2px rgba(18,33,30,.06),0 6px 20px rgba(18,33,30,.06);
  --f-display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1412; --surface:#131f1c; --surface-2:#1a2925; --line:#2a3c37; --ink:#e2ebe8; --muted:#93a7a2;
  --accent:#4dbdab; --accent-ink:#04201b; --accent-soft:#15382f;
  --ok:#5fcf89; --ok-soft:#163423; --warn:#efb257; --warn-soft:#382811; --bad:#f8776c; --bad-soft:#3c1916;
  --info:#7db3f3; --info-soft:#162a41; --violet:#b39bf6; --violet-soft:#292142;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0c1412; --surface:#131f1c; --surface-2:#1a2925; --line:#2a3c37; --ink:#e2ebe8; --muted:#93a7a2;
  --accent:#4dbdab; --accent-ink:#04201b; --accent-soft:#15382f;
  --ok:#5fcf89; --ok-soft:#163423; --warn:#efb257; --warn-soft:#382811; --bad:#f8776c; --bad-soft:#3c1916;
  --info:#7db3f3; --info-soft:#162a41; --violet:#b39bf6; --violet-soft:#292142;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark;}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;margin:0}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;line-height:1.25;margin:0;text-wrap:balance}
h1{font-size:1.9rem} h2{font-size:1.3rem} h3{font-size:1.08rem} h4{font-size:.95rem}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.muted{color:var(--muted)} .small{font-size:.85rem} .tiny{font-size:.76rem}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:.5rem .9rem;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.ok{color:var(--ok);border-color:var(--ok-soft)}
.btn.sm{padding:.3rem .6rem;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:.75rem}
.grid{display:grid;gap:1rem}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.g4{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.grid>*,.row>*{min-width:0}

/* forms */
label.f{display:flex;flex-direction:column;gap:.3rem;font-size:.86rem;color:var(--muted);font-weight:500}
label.f>span{color:var(--muted)}
input[type=text],input[type=password],input[type=email],input[type=date],input[type=tel],input[type=number],input[type=search],select,textarea{
  width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.55rem .7rem;color:var(--ink)}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.err{color:var(--bad);font-size:.85rem}
.req::after{content:" *";color:var(--bad)}

/* app bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{max-width:1180px;margin:0 auto;padding:.6rem 16px;display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.55rem;font-family:var(--f-display);font-weight:600;font-size:1.02rem}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.brand small{display:block;font-family:var(--f-body);font-weight:400;color:var(--muted);font-size:.74rem}
.bar .sp{flex:1}
.proto{font-size:.7rem;padding:.12rem .45rem;border-radius:99px;background:var(--warn-soft);color:var(--warn);font-weight:600}
.tabs{max-width:1180px;margin:0 auto;padding:0 16px;display:flex;gap:.2rem;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:.6rem .85rem;border-bottom:2px solid transparent;color:var(--muted);cursor:pointer;white-space:nowrap;font-weight:500}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab .count{background:var(--bad);color:#fff;border-radius:99px;font-size:.7rem;padding:0 .4rem;margin-inline-start:.3rem}

main{max-width:1180px;margin:0 auto;padding-block:1.4rem 3rem;padding-inline:16px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap;margin-bottom:1.1rem}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:1.1rem;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.section{display:flex;flex-direction:column;gap:1rem;margin-bottom:1.6rem}
.hr{height:1px;background:var(--line);margin:.4rem 0}
.empty{padding:1.6rem;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}

/* chips & pills */
.pill{display:inline-flex;align-items:center;gap:.3rem;font-size:.76rem;font-weight:600;padding:.14rem .55rem;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--info-soft);color:var(--info)}
.pill.violet{background:var(--violet-soft);color:var(--violet)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:.32rem .8rem;cursor:pointer;font-size:.86rem}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.alert{display:flex;gap:.6rem;align-items:flex-start;padding:.7rem .9rem;border-radius:8px;font-size:.9rem}
.alert.bad{background:var(--bad-soft);color:var(--bad)} .alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.info{background:var(--info-soft);color:var(--info)} .alert.ok{background:var(--ok-soft);color:var(--ok)}

/* avatar */
.av{width:44px;height:44px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;flex:none;overflow:hidden;font-family:var(--f-display)}
.av img{width:100%;height:100%;object-fit:cover}
.av.lg{width:92px;height:92px;font-size:1.6rem;border-radius:12px}

/* login */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:2rem;align-items:center;margin-bottom:1.6rem}
.hero h1{font-size:clamp(1.6rem,3.4vw,2.4rem)}
.hero p{color:var(--muted);max-width:56ch;margin-top:.6rem}
.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;font-size:.82rem}
.flow div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.6rem;text-align:center}
.flow b{display:block;font-family:var(--f-display);font-size:.9rem}
.roles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.7rem}
.role{display:flex;flex-direction:column;gap:.35rem;text-align:start;padding:.9rem;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer}
.role:hover{border-color:var(--accent)}
.role.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.role .ic{width:34px;height:34px;border-radius:8px;display:grid;place-items:center}
.role b{font-family:var(--f-display);font-weight:600}
.role span{font-size:.8rem;color:var(--muted)}

/* steps */
.steps{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1rem}
.step{font-size:.8rem;padding:.25rem .7rem;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.step.on{background:var(--accent);color:var(--accent-ink)} .step.done{background:var(--accent-soft);color:var(--accent)}

/* id card */
.idcard{display:grid;grid-template-columns:auto 1fr auto;gap:1rem;align-items:center;padding:1.1rem;border-radius:14px;
  background:linear-gradient(135deg,var(--accent) 0%,color-mix(in srgb,var(--accent) 70%,var(--ink)) 100%);color:var(--accent-ink);box-shadow:var(--shadow)}
.idcard .lbl{font-size:.7rem;opacity:.8;letter-spacing:.05em;text-transform:uppercase}
.idcard .val{font-weight:600}
.idcard .num{font-family:var(--f-mono);font-size:1.15rem;letter-spacing:.08em}
.idcard .av{background:rgba(255,255,255,.18);color:inherit}
.qrbox{background:#ffffff;padding:8px;border-radius:10px;line-height:0;flex:none}
.qrbox img,.qrbox canvas{display:block;width:120px;height:120px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.7rem}
.kv div{display:flex;flex-direction:column;min-width:0;overflow-wrap:anywhere}
.kv span{font-size:.75rem;color:var(--muted)}
.idcard .kv span{color:inherit;opacity:.8}

/* lists / tables */
.list{display:flex;flex-direction:column}
.li{display:flex;gap:.8rem;align-items:center;padding:.75rem 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{text-align:start;padding:.5rem .55rem;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.74rem;color:var(--muted);font-weight:600;letter-spacing:.03em}
td.num{font-variant-numeric:tabular-nums}
tr.hi td{background:var(--bad-soft)} tr.lo td{background:var(--info-soft)}

/* timeline */
.tl{display:flex;flex-direction:column;gap:.9rem}
.tli{display:grid;grid-template-columns:4px 1fr;gap:.9rem}
.tli>*{min-width:0}
.tli .stripe{border-radius:4px;background:var(--accent)}
.tli.rx .stripe{background:var(--ok)} .tli.lab .stripe{background:var(--violet)} .tli.img .stripe{background:var(--info)}
.sub{border:1px solid var(--line);border-radius:8px;padding:.75rem;background:var(--surface-2)}
.sub h4{margin-bottom:.4rem;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}

/* doctors */
.spec{display:flex;gap:.6rem;align-items:center;padding:.7rem .8rem;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;text-align:start}
.spec:hover{border-color:var(--accent)}
.spec .n{font-size:.75rem;color:var(--muted)}
.spec .ic{width:36px;height:36px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--f-display);font-weight:600;flex:none;font-size:.85rem}
.doc{display:flex;flex-direction:column;gap:.6rem}
.stars{color:#d99a00;letter-spacing:1px;font-size:.95rem}
.tier-elite{background:var(--violet-soft);color:var(--violet)}
.tier-premium{background:var(--info-soft);color:var(--info)}
.rate-in{display:flex;gap:.15rem;direction:ltr}
.rate-in button{border:0;background:none;font-size:1.5rem;cursor:pointer;color:var(--line);padding:0 .1rem}
.rate-in button.on{color:#d99a00}

/* week grid */
.week-wrap{overflow-x:auto}
.week{display:grid;gap:4px;min-width:720px}
.week .dh{font-size:.78rem;text-align:center;padding:.35rem;border-radius:6px;background:var(--surface-2)}
.week .dh.today{background:var(--accent-soft);color:var(--accent);font-weight:600}
.slot{border:1px solid var(--line);border-radius:6px;padding:.3rem;font-size:.76rem;text-align:center;background:var(--surface);min-height:32px;font-variant-numeric:tabular-nums}
.slot.free{cursor:pointer}
.slot.free:hover{border-color:var(--accent);background:var(--accent-soft)}
.slot.off{background:repeating-linear-gradient(45deg,var(--surface-2),var(--surface-2) 4px,transparent 4px,transparent 8px);border-style:dashed;color:var(--muted)}
.slot.past{opacity:.4}
.slot.taken{background:var(--surface-2);color:var(--muted)}
.slot.pending{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.slot.approved{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.slot.completed{background:var(--info-soft);color:var(--info);border-color:transparent}
.slot.sel{outline:2px solid var(--accent)}
.legend{display:flex;gap:.8rem;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:.3rem;vertical-align:middle}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.8rem}
.stat{padding:.8rem 1rem;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.stat b{display:block;font-family:var(--f-display);font-size:1.5rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted)}

/* scanner */
.scan{display:grid;grid-template-columns:1fr auto;gap:1rem;align-items:start}
.scan video{width:100%;max-width:320px;border-radius:8px;background:#000}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:1rem;text-align:center;color:var(--muted);cursor:pointer}
.drop:hover{border-color:var(--accent)}

/* rx rows */
.rxrow{display:grid;grid-template-columns:2fr 1fr 1.3fr 1fr 1.6fr auto;gap:.4rem;align-items:end}
.imgrow{display:grid;grid-template-columns:1fr 1.4fr 2fr auto;gap:.4rem;align-items:end}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:.3rem .8rem}
.checks label{display:flex;gap:.45rem;align-items:center;font-size:.88rem;cursor:pointer}
details.grp{border:1px solid var(--line);border-radius:8px;padding:.5rem .8rem;background:var(--surface)}
details.grp summary{cursor:pointer;font-weight:600;font-size:.9rem}

/* mail */
.mail{display:grid;grid-template-columns:auto 1fr auto;gap:.8rem;padding:.8rem 0;border-bottom:1px solid var(--line)}
.mail .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);margin-top:.45rem}
.mail .dot.read{background:transparent;border:1px solid var(--line)}
.mail pre{white-space:pre-wrap;font-family:inherit;margin:.3rem 0 0;color:var(--muted);font-size:.88rem}

/* toast */
#toast{position:fixed;inset-inline:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:50}
#toast div{background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:8px;box-shadow:var(--shadow);font-size:.9rem;max-width:min(90vw,520px)}

.foot{max-width:1180px;margin:0 auto;padding:1rem 16px 2rem;color:var(--muted);font-size:.8rem;display:flex;gap:1rem;flex-wrap:wrap;justify-content:space-between}

@media (max-width:820px){
  .hero{grid-template-columns:1fr}
  .idcard{grid-template-columns:auto 1fr}
  .idcard .qrbox{grid-column:1/-1;justify-self:center}
  .rxrow,.imgrow{grid-template-columns:1fr 1fr}
  .rxrow .wide,.imgrow .wide{grid-column:1/-1}
  .scan{grid-template-columns:1fr}
  h1{font-size:1.5rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

</style>
</head>
<body>
<div id="app"></div><div id="toast" aria-live="polite"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
/* ---------- Reference data (all people and facilities are fictional demo data) ---------- */
const SPECIALTIES = [
  ['internal','Internal Medicine','الباطنية'],['cardio','Cardiology','القلبية'],['pedia','Pediatrics','طب الأطفال'],
  ['obgyn','Obstetrics & Gynecology','النسائية والتوليد'],['ortho','Orthopedics','العظام والمفاصل'],['derm','Dermatology','الجلدية'],
  ['ent','ENT','الأنف والأذن والحنجرة'],['ophth','Ophthalmology','العيون'],['neuro','Neurology','الجملة العصبية'],
  ['psych','Psychiatry','الطب النفسي'],['uro','Urology','المجاري البولية'],['nephro','Nephrology','أمراض الكلى'],
  ['gastro','Gastroenterology','الجهاز الهضمي والكبد'],['pulmo','Pulmonology','الأمراض الصدرية'],['endo','Endocrinology & Diabetes','الغدد الصم والسكري'],
  ['onco','Oncology','الأورام'],['hema','Hematology','أمراض الدم'],['rheum','Rheumatology','الروماتيزم'],

  ['plastic','Plastic Surgery','جراحة التجميل'],['vascular','Vascular Surgery','جراحة الأوعية الدموية'],['dental','Dentistry','طب الأسنان'],
  ['family','Family Medicine','طب الأسرة'],['infect','Infectious Diseases','الأمراض المعدية'],['allergy','Allergy & Immunology','الحساسية والمناعة'],
  ['physio','Physical Medicine & Rehab','الطب الطبيعي والتأهيل'],['nutrition','Clinical Nutrition','التغذية العلاجية'],['geri','Geriatrics','طب كبار السن'],
  ['pain','Pain Management','علاج الألم']
].map(([key,en,ar])=>({key,name:{en,ar}}));

const AREAS = [['Al-Dawasa','الدواسة'],['Al-Muthanna','المثنى'],['Al-Zuhur','الزهور'],['Al-Baladiyat','البلديات'],['Al-Faisaliya','الفيصلية'],
  ['Al-Hadbaa','الحدباء'],['Al-Jamia','الجامعة'],['Al-Nabi Younis','النبي يونس'],['Al-Majmooa','المجموعة الثقافية']].map(([en,ar])=>({en:'Mosul · '+en,ar:'الموصل · '+ar}));

const M_FIRST=[['Ahmed','أحمد'],['Mohammed','محمد'],['Omar','عمر'],['Ali','علي'],['Yasir','ياسر'],['Khalid','خالد'],['Mustafa','مصطفى'],['Hussein','حسين'],
  ['Ibrahim','إبراهيم'],['Saad','سعد'],['Firas','فراس'],['Ammar','عمار'],['Ziad','زياد'],['Nawfal','نوفل'],['Raad','رعد'],['Bashar','بشار'],['Yousif','يوسف'],['Hazim','حازم']];
const F_FIRST=[['Sara','سارة'],['Noor','نور'],['Rana','رنا'],['Zainab','زينب'],['Huda','هدى'],['Lina','لينا'],['Shahad','شهد'],['Maryam','مريم'],
  ['Duaa','دعاء'],['Asmaa','أسماء'],['Rasha','رشا'],['Hiba','هبة'],['Aseel','أسيل'],['Ruqaya','رقية']];

/* ---------- seeded PRNG so demo data is stable ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function buildDoctors(){
  const rnd=mulberry32(20261004), pick=a=>a[Math.floor(rnd()*a.length)];
  const docs=[]; let n=1;
  SPECIALTIES.forEach(sp=>{
    const count=3+Math.floor(rnd()*2); // 3–4 per specialty
    for(let i=0;i<count;i++){
      const female=rnd()<.38, f=pick(female?F_FIRST:M_FIRST), l=pick(LAST), sf=pick(M_FIRST), sl=pick(F_FIRST);
      const tier=i===0||rnd()<.3?'elite':'premium';
      const id='D'+String(n++).padStart(3,'0');
      const allDays=[0,1,2,3,4,5]; // Sat..Thu (Friday off)
      const days=allDays.filter(()=>rnd()<.72); if(days.length<3) days.push(0,2,4);
      const start=pick([15,16,16,17]), end=start+pick([3,4,4,5]);
      const avg=tier==='elite'?4.4+rnd()*.55:3.9+rnd()*.7, cnt=20+Math.floor(rnd()*(tier==='elite'?260:120));
      docs.push({
        id, spec:sp.key, tier, female,
        name:{en:'Dr. '+f[0]+' '+l[0], ar:'د. '+f[1]+' '+l[1]},
        title: tier==='elite'
          ? {en:'Consultant · FIBMS'+(rnd()<.5?', MRCP (UK)':', Arab Board'), ar:'استشاري · البورد العراقي'+(rnd()<.5?' وزمالة بريطانية':' والبورد العربي')}
          : {en:'Specialist · '+pick(['FIBMS','Arab Board','MSc']), ar:'اختصاص · '+pick(['البورد العراقي','البورد العربي','ماجستير'])},
        years: tier==='elite'?14+Math.floor(rnd()*18):5+Math.floor(rnd()*10),
        area:pick(AREAS), fee:(tier==='elite'?25:15)*1000+Math.floor(rnd()*3)*5000,
        days:[...new Set(days)].sort(), start, end, slot:20,
        base:{sum:Math.round(avg*cnt), count:cnt},
        secretary:(()=>{const s=rnd()<.6?sl:sf, ll=pick(LAST); return {id:'S'+id.slice(1), name:{en:s[0]+' '+ll[0], ar:s[1]+' '+ll[1]}}})()
      });
    }
  });
  return docs;
}
function buildFacilities(){
  const rnd=mulberry32(77);
  const mk=(arr,type,prefix)=>arr.map(([en,ar],i)=>({id:prefix+(i+1),type,name:{en,ar},area:AREAS[(i*3+1)%AREAS.length],
    phone:'0770 '+String(100+Math.floor(rnd()*899))+' '+String(1000+Math.floor(rnd()*8999)),hours:i%3===2?{en:'24 hours',ar:'24 ساعة'}:{en:'9:00 – 22:00',ar:'9:00 – 22:00'}}));
  return [...mk(PHARMACIES,'pharmacy','PH'),...mk(LABS,'lab','LB'),...mk(RADIOLOGY,'radiology','RD')];
}

/* ---------- helpers ---------- */
const KEY='mns-proto-v1', PREF='mns-pref';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let lang='ar';
try{const p=JSON.parse(localStorage.getItem(PREF)||'{}'); if(p.lang) lang=p.lang}catch(e){}
const Lraw=(o,lg=lang)=>o==null?'':(typeof o==='object'?(o[lg]??o.en??''):String(o));
const L=(o,lg)=>esc(Lraw(o,lg));
function t(k,vars){const e=I18N[k]; let s=e?(lang==='ar'?e[1]:e[0]):k; if(!e&&window.__missing) window.__missing.add(k);
  if(vars) s=s.replace(/\{(\w+)\}/g,(m,n)=>vars[n]??''); return s}
const pad=n=>String(n).padStart(2,'0');
const isoOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>isoOf(new Date());
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return isoOf(d)};
const dIdx=s=>(parseD(s).getDay()+1)%7;            // Saturday = 0 … Friday = 6
const weekStart=s=>addDays(s,-dIdx(s));
const nowHM=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const DAYS={en:['Saturday','Sunday','Monday','Tuesday','Wednesday','Thursday','Friday'],ar:['السبت','الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة']};
const locOf=lg=>lg==='ar'?'ar-IQ-u-nu-latn':'en-GB';
const fD=(s,lg=lang)=>s?parseD(s).toLocaleDateString(locOf(lg),{day:'numeric',month:'short',year:'numeric'}):'—';
const fDw=(s,lg=lang)=>parseD(s).toLocaleDateString(locOf(lg),{weekday:'long',day:'numeric',month:'short'});
const fTS=ts=>new Date(ts).toLocaleString(locOf(lang),{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const both=fn=>({en:fn('en'),ar:fn('ar')});
const money=n=>n.toLocaleString(locOf(lang))+' '+t('iqd');
const uid=p=>p+(S.seq++).toString(36).toUpperCase();
const age=dob=>{const d=parseD(dob),n=new Date();let a=n.getFullYear()-d.getFullYear();if(n.getMonth()<d.getMonth()||(n.getMonth()===d.getMonth()&&n.getDate()<d.getDate()))a--;return a};
const fmtId=id=>/^\d{12}$/.test(id)?id.replace(/(\d{4})(\d{4})(\d{4})/,'$1 $2 $3'):id;
const initials=o=>Lraw(o,'en').replace(/^Dr\.\s*/,'').split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase();
function slotsOf(d){const o=[];for(let m=d.start*60;m<d.end*60;m+=d.slot)o.push(pad(Math.floor(m/60))+':'+pad(m%60));return o}

/* ---------- reference lookups ---------- */
const DOCTORS=buildDoctors(), FAC=buildFacilities();
// the two demo doctors work every day except Friday so the walkthrough always has a working day
const DEMO_DOC=DOCTORS.find(d=>d.spec==='cardio'), DEMO_ENDO=DOCTORS.find(d=>d.spec==='endo');
[DEMO_DOC,DEMO_ENDO].forEach(d=>{d.days=[0,1,2,3,4,5];d.start=16;d.end=20});
const docById=id=>DOCTORS.find(d=>d.id===id), facById=id=>FAC.find(f=>f.id===id);
const specOf=k=>SPECIALTIES.find(s=>s.key===k), testOf=c=>LAB_TESTS.find(x=>x.code===c), modOf=c=>MODALITIES.find(m=>m.code===c), freqOf=c=>FREQS.find(f=>f.code===c);
const secByDoc=d=>({...d.secretary,doctorId:d.id});
const secById=id=>{const d=DOCTORS.find(x=>x.secretary.id===id);return d?secByDoc(d):null};

/* ---------- persistent state ---------- */
let S=null;
function store(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function loadState(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.v===1)return s}catch(e){}return null}
const pat=id=>S.patients.find(p=>p.id===id);

function nextWorking(doc,date){let d=date;for(let i=0;i<8&&!doc.days.includes(dIdx(d));i++)d=addDays(d,1);return d}
function prevWorking(doc,date){let d=date;for(let i=0;i<8&&!doc.days.includes(dIdx(d));i++)d=addDays(d,-1);return d}

/* ---------- allergy cross-check ---------- */
function allergyHits(p,drugs){
  const al=(p.allergies||'').toLowerCase(); if(!al.trim())return [];
  const keys=Object.keys(ALLERGY_MAP).filter(k=>al.includes(k));
  const words=al.split(/[,،;]+/).map(s=>s.trim()).filter(Boolean);
  return drugs.filter(d=>{const dl=d.toLowerCase();return keys.some(k=>ALLERGY_MAP[k].some(w=>dl.includes(w)))||words.some(w=>w.length>3&&dl.includes(w))});
}

function readImage(file,max,cb){const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));
  const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.82),c)};
  img.onerror=()=>cb(null);img.src=r.result};r.onerror=()=>cb(null);r.readAsDataURL(file)}

function timeline(pid,filter='all'){

  const wrap=(cls,html)=>`<article class="tli ${cls}"><div class="stripe"></div><div>${html}</div></article>`;

let camStream=null,camRAF=0;
function stopCamera(){if(camStream){camStream.getTracks().forEach(x=>x.stop());camStream=null}cancelAnimationFrame(camRAF)}
async function startCamera(){
  const v=$('#cam'), err=$('#scanErr');
  try{ if(!navigator.mediaDevices?.getUserMedia) throw 0;
    camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    v.srcObject=camStream; v.hidden=false; await v.play();
    const c=document.createElement('canvas'), x=c.getContext('2d',{willReadFrequently:true});
    const tick=()=>{ if(!camStream) return;
      if(v.readyState>=2&&window.jsQR){c.width=v.videoWidth;c.height=v.videoHeight;x.drawImage(v,0,0);
        const code=jsQR(x.getImageData(0,0,c.width,c.height).data,c.width,c.height); if(code){stopCamera();openScanned(code.data);return}}
      camRAF=requestAnimationFrame(tick)}; tick();
  }catch(e){ stopCamera(); if(err) err.textContent=t('cameraBlocked') }

function weekGrid(d,offset,mode,pid){
  const ws=addDays(weekStart(today()),offset*7), sl=slotsOf(d), td=today();
  const cols=[0,1,2,3,4,5];
  let h=`<div class="week-wrap"><div class="week" style="grid-template-columns:64px repeat(6,1fr)"><div></div>`;
  h+=cols.map(i=>{const dt=addDays(ws,i);return `<div class="dh ${dt===td?'today':''}"><b>${DAYS[lang][i]}</b><br><span class="tiny">${parseD(dt).toLocaleDateString(locOf(lang),{day:'numeric',month:'short'})}</span></div>`}).join('');
  sl.forEach(tm=>{h+=`<div class="tiny muted mono" style="align-self:center">${tm}</div>`;
    cols.forEach(i=>{const dt=addDays(ws,i);
      if(!d.days.includes(i)){h+=`<div class="slot off" aria-label="${t('closed')}"></div>`;return}
      const a=apptAt(d.id,dt,tm), past=isPast(dt,tm);
      if(mode==='book'){
        if(a){const mine=a.pid===pid;h+=`<div class="slot ${mine?(a.status==='approved'?'approved':a.status==='pending'?'pending':'completed'):'taken'} ${past?'past':''}">${mine?t('you'):'—'}</div>`}
        else if(past) h+=`<div class="slot past">${tm}</div>`;
        else{const on=ui.sel&&ui.sel.date===dt&&ui.sel.time===tm;h+=`<button class="slot free ${on?'sel':''}" data-a="pick" data-date="${dt}" data-time="${tm}">${tm}</button>`}
      }else{
        if(a){const p=pat(a.pid);h+=`<div class="slot ${a.status==='noshow'?'taken':a.status}" title="${L(p.name)}">${esc(Lraw(p.name).split(' ')[0])}</div>`}
        else h+=`<div class="slot ${past?'past':''}"></div>`;
      }});});
  return h+`</div></div>`;
}

    const p={id:d.id,idType:d.idType,username:d.username,password:d.password,name:d.name,dob:d.dob,gender:d.gender,blood:d.blood,phone:d.phone,email:d.email,emailVerified:true,
      address:d.address,emergency:d.emergency,allergies:d.allergies,chronic:d.chronic,photo:d.photo,prefs:{pharmacy:'PH1',lab:'LB1',radiology:'RD1'},created:Date.now()};
    S.patients.push(p); sendMail(p.id,'welcome',{name:p.name,id:fmtId(p.id)}); store();
    r.pid=p.id;r.err='';r.step=5;render()},
  scanId(f){openScanned(f.id.value)},
  book(f){
    const d=docById(ui.doc), p=me(), s=ui.sel, ws=weekStart(s.date);
    if(apptAt(d.id,s.date,s.time)){toast(t('slotGone'));ui.sel=null;render();return}
    const dup=S.appts.find(a=>a.pid===p.id&&a.did===d.id&&ACTIVE.includes(a.status)&&weekStart(a.date)===ws);
    if(dup){toast(t('onePerWeek'));return}
    const a={id:uid('A'),pid:p.id,did:d.id,date:s.date,time:s.time,status:'pending',reason:f.reason.value.trim(),by:'patient',created:Date.now()};
    S.appts.push(a); sendMail(p.id,'booked',apptVars(a)); ui.sel=null; store(); render(); toast(t('requestSent'))},
  rate(f){
    if(!ui.stars){$('#rateErr').textContent=t('pickStars');return}
    const a=S.appts.find(x=>x.id===ui.rateFor);
    S.ratings.push({id:uid('RT'),did:a.did,pid:a.pid,appt:a.id,stars:ui.stars,comment:f.comment.value.trim(),at:Date.now()});
    a.rated=true; ui.rateFor=null; store(); render(); toast(t('thanksRating'))},
  saveVisit(f){
    const d=docById(S.session.id), p=pat(ui.open), td=today(), err=$('#vfErr');
    const dx=f.dx.value.trim(); if(!dx){err.textContent=t('dxRequired');return}
    const items=$$('#rxRows .rxrow').map(r=>({drug:$('[name=drug]',r).value.trim(),dose:$('[name=dose]',r).value.trim(),freq:$('[name=freq]',r).value,dur:$('[name=dur]',r).value.trim(),ins:$('[name=ins]',r).value.trim(),done:false})).filter(i=>i.drug);
    const labs=$$('input[name=lab]:checked',f).map(c=>c.value);
    const imgs=$$('#imgRows .imgrow').map(r=>({mod:$('[name=mod]',r).value,region:$('[name=region]',r).value.trim(),note:$('[name=note]',r).value.trim()})).filter(i=>i.region);
    if($$('#imgRows .imgrow').some(r=>!$('[name=region]',r).value.trim())){err.textContent=t('regionRequired');return}
    let next=f.next.value||null, nextTime=null;
    if(next){
      if(!d.days.includes(dIdx(next))){err.textContent=t('notWorkingDay',{day:DAYS[lang][dIdx(next)]});return}
      nextTime=firstFreeSlot(d,next); if(!nextTime){err.textContent=t('dayFull');return}}
    const vid=uid('V');
    S.visits.push({id:vid,pid:p.id,did:d.id,date:td,dx,notes:f.notes.value.trim(),next});
    if(items.length){S.rx.push({id:uid('R'),visit:vid,pid:p.id,did:d.id,date:td,status:'new',items});sendMail(p.id,'rx',{doctor:d.name,count:items.length})}
    if(labs.length){S.labs.push({id:uid('L'),visit:vid,pid:p.id,did:d.id,date:td,status:'ordered',tests:labs.map(code=>({code,val:''}))});
      sendMail(p.id,'labOrdered',{doctor:d.name,tests:testsText(labs),facility:facById(p.prefs.lab).name})}
    imgs.forEach(m=>{S.imgs.push({id:uid('I'),visit:vid,pid:p.id,did:d.id,date:td,status:'ordered',...m})});
    if(imgs.length) sendMail(p.id,'imgOrdered',{doctor:d.name,tests:both(lg=>imgs.map(m=>Lraw(modOf(m.mod).name,lg)+' · '+m.region).join(lg==='ar'?'، ':', '))});
    const linked=ui.visitAppt&&S.appts.find(a=>a.id===ui.visitAppt);
    if(linked){linked.status='completed';linked.visit=vid}
    else S.appts.push({id:uid('A'),pid:p.id,did:d.id,date:td,time:nowHM().slice(0,3)+'00',status:'completed',reason:{en:'Walk-in',ar:'مراجعة مباشرة'},by:'doctor',created:Date.now(),visit:vid,walkin:true});
    if(next){const a={id:uid('A'),pid:p.id,did:d.id,date:next,time:nextTime,status:'pending',reason:{en:'Follow-up visit',ar:'زيارة متابعة'},by:'doctor',created:Date.now()};
      S.appts.push(a);sendMail(p.id,'followup',apptVars(a))}
    ui.visitOpen=false;ui.visitAppt=null;ui.recFilter='all';store();render();window.scrollTo(0,0);toast(t('visitSaved'))},
};

/* ---------- change / input handlers ---------- */
const C={
  regPhoto(el){const file=el.files[0];if(!file)return;readImage(file,320,url=>{if(!url){toast(t('badImage'));return}ui.reg.d.photo=url;
    $('#rg-photo-prev').innerHTML=avatar(ui.reg.d.name||'?',url,'lg')})},
  regDoc(el){const file=el.files[0];if(!file)return;ui.reg.d.docName=file.name;$('#rg-doc-name').textContent=' · '+file.name},
  idType(el){const f=el.form;ui.reg.d.idType=el.value;ui.reg.d.idNumber=f.idNumber.value;render()},
  sort(el){ui.sort=el.value;render()},
  qrFile(el){const file=el.files[0];if(!file)return;readImage(file,1000,(url,c)=>{
    const err=$('#scanErr'); if(!url||!window.jsQR){err.textContent=t('qrUnreadable');return}
    const code=jsQR(c.getContext('2d').getImageData(0,0,c.width,c.height).data,c.width,c.height);
    if(!code){err.textContent=t('qrUnreadable');return} openScanned(code.data)})},
};
function checkAllergy(){const box=$('#rxWarn');if(!box)return;const p=pat(ui.open);
  const hits=allergyHits(p,$$('#rxRows [name=drug]').map(i=>i.value).filter(Boolean));
  box.innerHTML=hits.length?`<div class="alert bad">${ic('alert',18)}<span>${t('allergyClash',{drugs:esc(hits.join(', '))})}</span></div>`:''}

document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const fn=A[el.dataset.a];if(fn){e.preventDefault();fn(el,e)}});
document.addEventListener('submit',e=>{const f=e.target.closest('[data-f]');if(!f)return;e.preventDefault();F[f.dataset.f]?.(f)});
document.addEventListener('change',e=>{const el=e.target.closest('[data-ch]');if(el)C[el.dataset.ch]?.(el)});
document.addEventListener('input',e=>{const el=e.target;
  if(el.dataset.in==='q'){ui.q=el.value;$('#docResults').innerHTML=docResults()}
  if(el.dataset.in==='drug') checkAllergy()});

/* ---------- boot ---------- */
S=loadState(); if(!S) seed();
render();

</script>
